# Gabarito da avaliação — 37 consultas em 3 famílias.
#
# As famílias existem para que a média não esconda o resultado. Uma tabela com
# uma linha por estratégia diz quem ganhou; a mesma tabela quebrada por família
# diz POR QUE — e é sempre a mesma história: cada motor domina uma família e
# afunda na outra.
#
#   literal     — o identificador está escrito no documento, letra por letra.
#                 Casamento exato resolve. O denso tem que adivinhar.
#   conceptual  — a consulta descreve a situação com OUTRO vocabulário.
#                 Nenhuma palavra da consulta precisa existir no alvo.
#   hybrid      — identificador + descrição na mesma frase. É o caso real, e é
#                 onde nenhum motor sozinho é suficiente.
#
# `relevant` lista TODOS os documentos que respondem — não só o principal. Doc
# que menciona o mesmo identificador de passagem conta, porque devolvê-lo não é
# erro. Gabarito artificialmente estreito infla a diferença entre estratégias.

queries:
  # ============================================================ literal
  - id: q_lit_01
    family: literal
    text: "OS-4471"
    relevant: [os_4471]
    note: "Número de ordem de serviço. Existe em um documento só."

  - id: q_lit_02
    family: literal
    text: "nota fiscal 128.512"
    relevant: [nf_128512]
    note: "Número com ponto — testa se a tokenização não parte o identificador."

