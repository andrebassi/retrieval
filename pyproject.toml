[project]
name = "retrieval-poc"
version = "0.1.0"
description = "Compara léxico (BM25), semântico (denso), fusão (RRF) e reranking sobre o mesmo corpus em português"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "numpy>=2.1.0",
    "rich>=13.9.0",
    "datasets>=3.2.0",
    # Reranker cross-encoder: pontua o par (consulta, documento) junto, em vez de
    # comparar dois vetores feitos separadamente. É a única etapa que lê os dois
    # textos ao mesmo tempo — e a única que não dá para pré-computar.
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
]

[project.scripts]
poc = "retrieval_poc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_poc"]

[tool.uv]
package = true
